{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 border border-secondary bg-dark">
            <h2 class="mb-4 text-success text-center">Registrar Canción</h2>
            
            <form id="form-cancion">
                <div class="mb-3">
                    <label class="form-label">Título de la canción</label>
                    <input type="text" id="can-nombre" class="form-control bg-secondary text-white" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Artista</label>
                    <select id="can-artista" class="form-select bg-secondary text-white" required>
                        <option value="">Selecciona un artista...</option>
                        {% for artista in artistas %}
                            <option value="{{ artista.id }}">{{ artista.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duración (segundos)</label>
                        <input type="number" id="can-duracion" class="form-control bg-secondary text-white" placeholder="Ej: 210" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Género</label>
                        <input type="text" id="can-genero" class="form-control bg-secondary text-white" placeholder="Ej: Rock">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="button" id="btn-save-cancion" class="btn btn-success w-100">Guardar Canción</button>
                    <a href="/canciones" class="btn btn-outline-light w-100 mt-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/cancion.js') }}"></script>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-success mb-4"><i class="fas fa-list"></i> Administrar Playlist #{{ id }}</h2>

    <div class="card bg-dark text-white border-success mb-4 shadow">
        <div class="card-body">
            <h5 class="card-title text-success"><i class="fas fa-plus-circle"></i> Agregar nueva rola</h5>
            <p class="card-text text-muted small">Selecciona una canción de la plataforma para añadirla a tu lista.</p>
            
            <div class="input-group mt-3">
                <select id="select-cancion" class="form-select bg-dark text-white border-success">
                    <option value="" disabled selected>-- Elige una canción --</option>
                    {% for c in canciones %}
                        <option value="{{ c.id }}">{{ c.nombre }}</option>
                    {% endfor %}
                </select>
                <button class="btn btn-success" id="btn-agregar-cancion" data-playlist-id="{{ id }}">
                    Agregar a la Lista
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='js/detalle_playlist.js') }}"></script>
{% endblock %}

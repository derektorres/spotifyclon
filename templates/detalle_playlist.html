{% extends "base.html" %}

{% block content %}
<div class="mb-4">
    <a href="/playlists" class="btn btn-outline-light btn-sm">← Volver a mis listas</a>
</div>

<h2>Detalle de la Playlist #{{ id }}</h2>

<div class="mt-4">
    <table class="table table-dark table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Título</th>
                <th>Artista</th>
                <th>Duración</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="4" class="text-center text-muted py-5">
                    No hay canciones en esta playlist todavía.
                </td>
            </tr>
        </tbody>
    </table>
</div>
{% endblock %}

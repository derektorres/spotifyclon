{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="text-center mb-4">Crear Cuenta</h2>
        <form method="POST" class="bg-dark p-4 rounded">
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" name="nombre" id="user-name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" id="user-email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>País</label>
                <input type="text" name="pais" id="user-country" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="password" id="user-password" class="form-control" required>
            </div>
            <button type="submit" id="btn-register" class="btn btn-success w-100">Registrarse</button>
            <p class="mt-3 text-center">¿Ya tienes cuenta? <a href="/signin">Inicia sesión</a></p>
        </form>
    </div>
</div>
{% endblock %}

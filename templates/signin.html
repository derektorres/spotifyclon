{% extends "base.html" %}
{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        <form class="bg-dark p-4 rounded">
            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="user-email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" id="user-password" name="password" class="form-control" required>
            </div>
            <button type="button" id="btn-signin" class="btn btn-success w-100">Entrar</button>
            <p class="mt-3 text-center">¿No tienes cuenta? <a href="/signup">Regístrate</a></p>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/signin.js') }}"></script>
{% endblock %}
